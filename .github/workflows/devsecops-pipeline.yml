name: DevSecOps CI/CD Pipeline (SAST, DAST, Container Scan)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # 1. ANALYSE STATIQUE DU CODE (SAST & SECRETS)
  # ==========================================
  sast_and_secrets:
    name: Code Security & Secrets Scanning
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2 (SHA vérifié)
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      # Détection des secrets : conteneur Docker officiel scellé
      - name: Run Gitleaks (Secret Detection)
        run: |
          docker run --rm -v "${{ github.workspace }}:/path" \
            zricethezav/gitleaks:latest detect --source="/path" --verbose

      # SAST : Semgrep avec le profil OWASP Top 10
      - name: Run Semgrep SAST
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" \
            returntocorp/semgrep semgrep scan --config auto --config p/owasp-top-ten --error

  # ==========================================
  # 2. BUILD, TESTS & ANALYSE DE DÉPENDANCES (SCA)
  # ==========================================
  build_and_sca:
    name: Build, Unit Tests & SCA
    needs: sast_and_secrets
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # actions/setup-java v4.7.0 (SHA officiel vérifié)
      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests=false

      # SCA : Trivy scannant le code source et le pom.xml
      - name: Run Trivy FS (SCA on dependencies)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" \
            aquasec/trivy:latest fs --severity HIGH,CRITICAL --exit-code 0 /src

  # ==========================================
  # 3. BUILD DOCKER & CONTAINER SCANNING
  # ==========================================
  docker_build_and_scan:
    name: Docker Image Build & Security Scan
    needs: build_and_sca
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build Docker Image
        run: |
          docker build -t identity-service:${{ github.sha }} .

      # Container Security : Scan de l'image construite
      - name: Run Trivy Container Scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity HIGH,CRITICAL identity-service:${{ github.sha }}

  # ==========================================
  # 4. DAST (DYNAMIC APPLICATION SECURITY TESTING)
  # ==========================================
  dast_testing:
    name: DAST with OWASP ZAP
    needs: docker_build_and_scan
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Démarrage des conteneurs applicatifs pour le test dynamique
      - name: Start Services for DAST
        run: |
          docker compose up -d
          timeout 60 bash -c 'until curl -s http://localhost:8081/actuator/health || curl -s http://localhost:8081/users/login; do sleep 3; done'

      # zaproxy/action-baseline v0.14.0 (SHA officiel vérifié)
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@4f829f0322c342f0a14fbdd48cfabf1d431057e9
        with:
          target: 'http://localhost:8081/'
          cmd_options: '-m 2'
          fail_action: false

      - name: Teardown Services
        if: always()
        run: docker compose down -v
