name: Identity Service CI and security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: identity-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: identity_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d identity_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Java 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Build and test
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/identity_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: ci-only-password
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Scan tracked history with Gitleaks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/path" \
            zricethezav/gitleaks:v8.24.2 \
            detect --redact --source=/path --report-format=json --report-path=/path/gitleaks-report.json
      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn
          retention-days: 7

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Scan Java with OWASP rules
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            semgrep/semgrep:1.100.0 \
            semgrep scan --config=p/java --config=p/owasp-top-ten \
            --error --json --output=/src/semgrep-report.json /src
      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: semgrep-report
          path: semgrep-report.json
          if-no-files-found: warn
          retention-days: 7

  dependency-scan:
    name: Dependency scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Scan Maven dependencies
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            aquasec/trivy:0.58.1 fs \
            --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            --format json --output /src/trivy-dependencies-report.json /src
      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: dependency-scan-report
          path: trivy-dependencies-report.json
          if-no-files-found: warn
          retention-days: 7

  image:
    name: Container build and scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build application image
        run: docker build --tag identity-service:${{ github.sha }} .
      - name: Scan image; fail on HIGH or CRITICAL
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/src" \
            aquasec/trivy:0.58.1 image \
            --severity HIGH,CRITICAL --exit-code 1 \
            --format json --output /src/trivy-image-report.json \
            identity-service:${{ github.sha }}
      - name: Upload image report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: container-scan-report
          path: trivy-image-report.json
          if-no-files-found: warn
          retention-days: 7

  dast:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Start local Compose stack
        env:
          LOCAL_POSTGRES_PASSWORD: ci-only-password
        run: docker compose up --build --detach
      - name: Wait for service readiness
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8081/actuator/health/readiness; then
              exit 0
            fi
            sleep 3
          done
          docker compose logs
          exit 1
      - name: Run ZAP baseline; fail on FAIL alerts
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:2.16.0 \
            zap-baseline.py -I -t http://127.0.0.1:8081/ \
            -r zap-report.html -J zap-report.json
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: zap-baseline-report
          path: |
            zap-report.html
            zap-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Stop local Compose stack
        if: always()
        env:
          LOCAL_POSTGRES_PASSWORD: ci-only-password
        run: docker compose down --volumes
